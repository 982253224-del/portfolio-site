# 推送到 main 后构建并部署到 GitHub Pages（需在仓库 Settings → Pages → Source 选 GitHub Actions）
name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Set VITE_BASE and public site URL
        id: base
        shell: bash
        run: |
          OWNER="${{ github.repository_owner }}"
          NAME="${{ github.event.repository.name }}"
          if [[ "$NAME" == *.github.io ]]; then
            echo "vite_base=/"
            echo "vite_base=/" >> "$GITHUB_OUTPUT"
            echo "site_url=https://${OWNER}.github.io/"
            echo "site_url=https://${OWNER}.github.io/" >> "$GITHUB_OUTPUT"
          else
            echo "vite_base=/${NAME}/"
            echo "vite_base=/${NAME}/" >> "$GITHUB_OUTPUT"
            echo "site_url=https://${OWNER}.github.io/${NAME}/"
            echo "site_url=https://${OWNER}.github.io/${NAME}/" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          VITE_BASE: ${{ steps.base.outputs.vite_base }}
          VITE_SITE_URL: ${{ steps.base.outputs.site_url }}
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
